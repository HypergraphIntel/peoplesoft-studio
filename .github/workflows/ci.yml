name: CI

on:
  push:
    branches: [main, master, query-criteria, 'release/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup browser for required rendered UI checks
        id: browser
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: ${{ runner.os == 'Linux' }}

      - name: Install
        run: npm ci

      - name: Verify (typecheck, tests, activation and rendered UI)
        run: npm run verify
        env:
          PSFT_BROWSER_BIN: ${{ steps.browser.outputs.chrome-path }}

      - name: MCP workflow routing and editor integration (fixtures)
        run: npm run test:mcp-workflows
