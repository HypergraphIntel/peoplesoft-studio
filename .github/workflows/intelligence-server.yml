name: Intelligence server

# The Discovery & Intelligence Network server (server/intelligence, docs/intelligence).
# Runs when the server or the client contract it implements changes.
on:
  push:
    branches: [main, master]
    paths: ["server/intelligence/**", "src/intelligence/**", ".github/workflows/intelligence-server.yml"]
  pull_request:
    branches: [main, master]
    paths: ["server/intelligence/**", "src/intelligence/**", ".github/workflows/intelligence-server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/intelligence
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: psft_intel
          POSTGRES_USER: psft_intel
          POSTGRES_PASSWORD: psft_intel_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psft_intel" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL (row locks, concurrency)
        env:
          PSFT_INTEL_TEST_DATABASE_URL: postgresql+psycopg://psft_intel:psft_intel_ci@127.0.0.1:5432/psft_intel
        run: pytest -q
